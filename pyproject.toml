[tool.poetry]
name = "maestro"
version = "0.1.0"
description = "AI Executive Assistant with Tri-Hybrid Architecture"
authors = ["Maestro Contributors"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
langchain = "^0.1.0"
langchain-community = "^0.0.13"
langgraph = "^0.0.20"
llama-index = "^0.9.0"
llama-index-readers-obsidian = "^0.1.0"
anthropic = "^0.8.0"
google-cloud-aiplatform = "^1.38.0"
google-auth = "^2.25.0"
google-auth-oauthlib = "^1.2.0"
google-api-python-client = "^2.110.0"
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
aiofiles = "^23.2.1"
redis = "^5.0.1"
celery = "^5.3.4"
tenacity = "^8.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.12.1"
ruff = "^0.1.9"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
