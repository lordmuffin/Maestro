upstream supervisor {
    server host.docker.internal:8003;
}

upstream local_rag {
    server host.docker.internal:8001;
}

upstream path_mapping {
    server host.docker.internal:8002;
}

upstream skills {
    server host.docker.internal:8004;
}

upstream evaluation {
    server host.docker.internal:8000;
}

resolver 127.0.0.11 ipv6=off;

server {
    listen 80;
    server_name localhost;

    # Serve React static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy routes
    location /api/supervisor/ {
        proxy_pass http://supervisor/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/rag/ {
        proxy_pass http://local_rag/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/mapping/ {
        proxy_pass http://path_mapping/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/skills/ {
        proxy_pass http://skills/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/evaluation/ {
        proxy_pass http://evaluation/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health check endpoint
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
