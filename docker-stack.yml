version: '3.8'

services:
  # ==============================================
  # Evaluation Service
  # ==============================================
  evaluation-api:
    image: maestro/evaluation-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NUM_PROMPTS=${NUM_PROMPTS:-1}
      - RUNS_PER_PROMPT=${RUNS_PER_PROMPT:-1}
    volumes:
      - evaluation-data:/app/data
    networks:
      - maestro-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================
  # Local RAG Agent
  # ==============================================
  local-rag:
    image: maestro/local-rag:latest
    build:
      context: ./agents/local_rag
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
      # LLM API Keys (optional - only use what you need)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - rag-data:/app/data
      - ${VAULT_HOST_PATH:-./data/vault}:/vault:ro
    networks:
      - maestro-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '2.0'
          memory: 12G
        reservations:
          cpus: '1.0'
          memory: 6G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==============================================
  # Path Mapping Service
  # ==============================================
  path-mapping:
    image: maestro/path-mapping:latest
    build:
      context: ./agents/cloud_integration
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - MAPPINGS_FILE=/app/data/path_mappings.json
    volumes:
      - mapping-data:/app/data
    networks:
      - maestro-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================
  # Supervisor Agent (Orchestrator)
  # ==============================================
  supervisor:
    image: maestro/supervisor:latest
    build:
      context: ./agents/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LOCAL_RAG_URL=http://local-rag:8001
      - PATH_MAPPING_URL=http://path-mapping:8002
      - SKILLS_URL=http://skills:8004
    networks:
      - maestro-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    depends_on:
      - local-rag
      - path-mapping
      - skills
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================
  # Skill Abstraction Layer
  # ==============================================
  skills:
    image: maestro/skills:latest
    build:
      context: ./agents/abstraction_layer
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - maestro-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ==============================================
# Networks
# ==============================================
networks:
  maestro-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.0.9.0/24

# ==============================================
# Volumes
# ==============================================
volumes:
  evaluation-data:
    driver: local
  rag-data:
    driver: local
  mapping-data:
    driver: local
