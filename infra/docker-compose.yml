version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maestro-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - maestro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: maestro-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - maestro-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_NUM_GPU:-0}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend/Dockerfile
    container_name: maestro-backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH}
      - GDRIVE_SYNC_PATH=${GDRIVE_SYNC_PATH}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ../backend:/app
      - ${LOCAL_OBSIDIAN_PATH:-../data/vault}:/app/data/vault:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS:-../credentials}:/app/credentials:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - maestro-network
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: maestro-webui
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_HOST}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - ENABLE_SIGNUP=true
      - WEBUI_NAME=Maestro AI Assistant
    volumes:
      - openwebui_data:/app/backend/data
      - ../frontend/open-webui-customizations:/app/backend/data/customizations
    ports:
      - "${WEBUI_PORT}:8080"
    depends_on:
      - postgres
      - ollama
      - backend
    networks:
      - maestro-network
    restart: unless-stopped

networks:
  maestro-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  openwebui_data:
