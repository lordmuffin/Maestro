name: 'OpenTofu Plan - Azure'

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/azure/**'
      - '.github/workflows/opentofu-pr-azure.yml'
      - 'V2V2B/azure_app/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write
  issues: write

env:
  OPENTOFU_VERSION: '1.8.0'
  WORKING_DIR: './terraform/azure'
  APP_DIR: './V2V2B/azure_app'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  plan-azure:
    name: 'Plan Azure'
    runs-on: ubuntu-latest
    environment: production # Using production environment variables for plan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Function Dependencies
        run: |
          echo "Installing dependencies to ${APP_DIR}/.python_packages/lib/site-packages"
          pip install --target="${APP_DIR}/.python_packages/lib/site-packages" -r ${APP_DIR}/requirements.txt

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: OpenTofu Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=prod.terraform.tfstate"

      - name: OpenTofu Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: tofu validate -no-color

      - name: OpenTofu Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set +e
          tofu plan \
            -no-color \
            -input=false \
            -out=tfplan \
            -detailed-exitcode 2>&1 | tee plan_output.txt

          EXIT_CODE=${PIPESTATUS[0]}
          echo "exitcode=${EXIT_CODE}" >> $GITHUB_OUTPUT

          if [[ "${EXIT_CODE}" == "0" ]] || [[ "${EXIT_CODE}" == "2" ]]; then
            exit 0
          else
            exit 1
          fi

      - name: Generate Plan Summary
        id: summary
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [[ "${{ steps.plan.outputs.exitcode }}" == "0" ]]; then
            echo "status=✅ No changes detected" >> $GITHUB_OUTPUT
            echo "details=Infrastructure matches configuration" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.plan.outputs.exitcode }}" == "2" ]]; then
            echo "status=📝 Changes detected" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            tofu show -no-color tfplan >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Plan failed" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            if [[ -f plan_output.txt ]]; then
              cat plan_output.txt >> $GITHUB_OUTPUT
            else
              echo "No plan output available." >> $GITHUB_OUTPUT
            fi
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Plan
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_DETAILS: ${{ steps.summary.outputs.details }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.summary.outputs.status }}';
            const details = process.env.PLAN_DETAILS;

            const output = `#### OpenTofu Plan for Azure (Production)

            **Status:** ${status}

            <details><summary>📋 Show Plan Details</summary>

            \`\`\`hcl
            ${details}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }} | Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
