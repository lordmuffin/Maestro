name: 'OpenTofu Drift Detection'

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  OPENTOFU_VERSION: '1.10.0'
  WORKING_DIR: './opentofu'
  # Azure Environment Variables
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  detect-drift:
    name: 'Detect Drift - ${{ matrix.environment }}'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Set Environment Secrets
        id: env_config
        run: |
          if [[ "${{ matrix.environment }}" == "production" ]]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/production.tfvars" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/staging.tfvars" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: OpenTofu Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ matrix.environment }}.terraform.tfstate"

      - name: Select Workspace
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu workspace select ${{ matrix.environment }} || {
            echo "Creating workspace..."
            tofu workspace new ${{ matrix.environment }}
          }

      - name: Detect Drift
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_github_tokens: '{"maestro":"${{ secrets.GH_TOKEN_MAESTRO }}","beyond":"${{ secrets.GH_TOKEN_BEYOND }}"}'
          TF_VAR_google_drive_folder_id: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '' }}
          TF_VAR_obsidian_drive_folder_id: ${{ vars.OBSIDIAN_DRIVE_FOLDER_ID || '' }}
          TF_VAR_kanban_folder_id: ${{ vars.KANBAN_FOLDER_ID || '' }}
          TF_VAR_drive_poll_interval: ${{ vars.DRIVE_POLL_INTERVAL || '300' }}
          TF_VAR_repos_config_file: 'repos.json'
          TF_VAR_environment: ${{ matrix.environment }}
        run: |
          tofu plan \
            -var-file="${{ steps.env_config.outputs.tfvars_file }}" \
            -detailed-exitcode \
            -no-color \
            -input=false > plan_output.txt 2>&1 || EXIT_CODE=$?

          if [[ "${EXIT_CODE}" == "2" ]]; then
             echo "status=drift-detected" >> $GITHUB_OUTPUT
          elif [[ "${EXIT_CODE}" == "0" ]]; then
             echo "status=no-drift" >> $GITHUB_OUTPUT
          else
             echo "status=error" >> $GITHUB_OUTPUT
             exit 1
          fi

      - name: Create Drift Issue
        if: steps.plan.outputs.status == 'drift-detected'
        uses: actions/github-script@v7
        with:
          script: |
            // ... (keeping existing logic simplified for length)
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Azure Infrastructure Drift Detected - ${{ matrix.environment }}`,
              body: `Drift detected in Azure environment.`
            });
