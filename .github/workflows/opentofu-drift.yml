name: 'OpenTofu Drift Detection'

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  id-token: write
  issues: write

env:
  OPENTOFU_VERSION: '1.10.0'
  WORKING_DIR: './terraform'

jobs:
  detect-drift:
    name: 'Detect Drift - ${{ matrix.environment }}'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
      fail-fast: false  # Continue checking other environments even if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Set Environment Secrets
        id: env_config
        run: |
          if [[ "${{ matrix.environment }}" == "production" ]]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/production.tfvars" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/staging.tfvars" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: OpenTofu Init
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        run: |
          tofu init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="prefix=terraform/state/${{ matrix.environment }}"

      - name: Select Workspace
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu workspace select ${{ matrix.environment }} || {
            echo "⚠️ Workspace ${{ matrix.environment }} does not exist"
            echo "Creating workspace..."
            tofu workspace new ${{ matrix.environment }}
          }

      - name: Detect Drift
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_gcp_project: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_github_tokens: '{"maestro":"${{ secrets.GH_TOKEN_MAESTRO }}","beyond":"${{ secrets.GH_TOKEN_BEYOND }}"}'
          TF_VAR_google_drive_folder_id: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '' }}
          TF_VAR_obsidian_drive_folder_id: ${{ vars.OBSIDIAN_DRIVE_FOLDER_ID || '' }}
          TF_VAR_kanban_folder_id: ${{ vars.KANBAN_FOLDER_ID || '' }}
          TF_VAR_drive_poll_interval: ${{ vars.DRIVE_POLL_INTERVAL || '300' }}
          TF_VAR_function_url: ${{ vars.FUNCTION_URL || '' }}
          TF_VAR_repos_config_file: 'repos.json'
        run: |
          tofu plan \
            -var-file="${{ steps.env_config.outputs.tfvars_file }}" \
            -detailed-exitcode \
            -no-color \
            -input=false > plan_output.txt 2>&1 || EXIT_CODE=$?

          echo "exitcode=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT

          if [[ "${EXIT_CODE:-0}" == "0" ]]; then
            echo "status=no-drift" >> $GITHUB_OUTPUT
            echo "✅ No drift detected"
          elif [[ "${EXIT_CODE:-0}" == "2" ]]; then
            echo "status=drift-detected" >> $GITHUB_OUTPUT
            echo "⚠️ Drift detected!"
            cat plan_output.txt
          else
            echo "status=error" >> $GITHUB_OUTPUT
            echo "❌ Error detecting drift"
            cat plan_output.txt
            exit 1
          fi

      - name: Upload Drift Report
        if: steps.plan.outputs.status == 'drift-detected'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ matrix.environment }}-${{ github.run_number }}
          path: terraform/plan_output.txt
          retention-days: 90

      - name: Create Drift Issue
        if: steps.plan.outputs.status == 'drift-detected'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('terraform/plan_output.txt', 'utf8');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Infrastructure Drift Detected - ${{ matrix.environment }}`,
              labels: ['drift-detection', 'infrastructure', '${{ matrix.environment }}'],
              body: `## Infrastructure Drift Detected

            **Environment:** \`${{ matrix.environment }}\`
            **Detection Date:** ${new Date().toISOString()}
            **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### What is Drift?

            Drift occurs when infrastructure resources are modified outside of Terraform (e.g., manual changes in GCP Console). This creates inconsistencies between the actual infrastructure state and the Terraform configuration.

            ### Detected Changes

            <details><summary>📋 Show Drift Details</summary>

            \`\`\`terraform
            ${planOutput.slice(0, 60000)}  // Truncate if too long
            \`\`\`

            </details>

            ### Recommended Actions

            1. **Review the changes** shown in the plan output above
            2. **Determine if changes are desired:**
               - If **YES**: Update OpenTofu configuration to match actual state
               - If **NO**: Run \`tofu apply\` to revert manual changes
            3. **Apply the fix** via a Pull Request
            4. **Prevent future drift:** Ensure all changes go through OpenTofu

            ### How to Fix

            \`\`\`bash
            # Option 1: Import manual changes into OpenTofu
            cd terraform
            tofu workspace select ${{ matrix.environment }}
            # Update .tf files to match actual state
            tofu plan  # Verify no drift
            # Create PR with updated configuration

            # Option 2: Revert manual changes
            tofu apply  # Reapply OpenTofu configuration
            \`\`\`

            ---

            **Note:** This issue was automatically created by the drift detection workflow.
            `
            });

            console.log(\`Created issue #\${issue.data.number}\`);

      - name: Send Email Notification
        if: steps.plan.outputs.status == 'drift-detected'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ vars.NOTIFICATION_EMAIL }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: '🔍 Maestro - Infrastructure Drift Detected (${{ matrix.environment }})'
          to: ${{ vars.NOTIFICATION_EMAIL }}
          from: 'Maestro GitOps <${{ vars.NOTIFICATION_EMAIL }}>'
          body: |
            Infrastructure drift detected in the ${{ matrix.environment }} environment.

            **Environment:** ${{ matrix.environment }}
            **Detection Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Drift indicates that infrastructure resources have been modified outside of Terraform.
            This could be due to manual changes in the GCP Console or other tools.

            A GitHub issue has been automatically created with detailed information:
            https://github.com/${{ github.repository }}/issues

            **Next Steps:**
            1. Review the GitHub issue for drift details
            2. Determine if the changes are intentional
            3. Either update OpenTofu config or revert the manual changes
            4. Run 'tofu plan' to verify drift is resolved

            **How to View Drift:**
            Run the following commands locally:
            ```
            cd terraform
            tofu workspace select ${{ matrix.environment }}
            tofu plan -var-file=environments/${{ matrix.environment }}.tfvars
            ```

            This is an automated notification from the Maestro drift detection workflow.
        continue-on-error: true

      - name: Create Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🔍 Drift Detection - ${{ matrix.environment }}

          **Status:** ${{ steps.plan.outputs.status == 'no-drift' && '✅ No Drift' || steps.plan.outputs.status == 'drift-detected' && '⚠️ Drift Detected' || '❌ Error' }}

          **Environment:** \`${{ matrix.environment }}\`
          **Workspace:** \`${{ matrix.environment }}\`
          **Detection Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ${{ steps.plan.outputs.status == 'drift-detected' && '### Actions Taken\n- ✅ GitHub issue created\n- ✅ Email notification sent\n- ✅ Drift report uploaded\n\n### Next Steps\n1. Review the created GitHub issue\n2. Investigate the source of drift\n3. Fix via Pull Request' || steps.plan.outputs.status == 'no-drift' && '### Next Steps\nNo action required. Infrastructure matches OpenTofu configuration.' || '### Error\nDrift detection failed. Check workflow logs.' }}
          EOF

  summary:
    name: 'Drift Detection Summary'
    runs-on: ubuntu-latest
    needs: detect-drift
    if: always()

    steps:
      - name: Create Overall Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🔍 Weekly Drift Detection Report

          **Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow:** [OpenTofu Drift Detection](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## Environments Scanned
          - Staging
          - Production

          ## Results
          Check individual job results above for detailed drift information.

          ---

          **Next Scheduled Run:** Next Monday at 9:00 AM UTC

          *This is an automated weekly scan to detect infrastructure drift.*
          EOF
