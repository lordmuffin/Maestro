name: 'OpenTofu Unlock'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'The pull request number that is blocked.'
        required: true
        type: string

env:
  OPENTOFU_VERSION: '1.10.0'
  WORKING_DIR: './opentofu'
  PR_NUMBER: ${{ github.event.inputs.pr_number }}
  # Azure Environment Variables
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  unlock_terraform_state:
    name: 'Unlock OpenTofu State'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup OpenTofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'OpenTofu Init'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=production.terraform.tfstate"

      - name: 'Extract Lock ID'
        id: extract_lock_id
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_MAESTRO }}
        run: |
          echo "🔐 Fetching logs to find the lock ID..."
          RUN_ID=$(gh run list --workflow "opentofu-apply-production.yml" --json databaseId,status --jq '.[] | select(.status == "failure" or .status == "cancelled" or .status == "timed_out") | .databaseId' | head -n 1)
          
          if [ -z "$RUN_ID" ]; then
             echo "::error::No failed run found"
             exit 1
          fi
          
          gh run view $RUN_ID --log > logs.txt
          LOCK_ID=$(grep -oP 'Lock ID: \K[a-f0-9-]+' logs.txt || echo "")
          
          if [ -z "$LOCK_ID" ]; then
             echo "::error::Could not find Lock ID"
             exit 1
          fi
          
          echo "LOCK_ID=${LOCK_ID}" >> $GITHUB_OUTPUT

      - name: 'Unlock OpenTofu State'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu force-unlock -force ${{ steps.extract_lock_id.outputs.LOCK_ID }}
