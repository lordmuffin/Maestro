name: 'Terraform Plan'

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'terraform/**'
      - '!terraform/azure/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  OPENTOFU_VERSION: '1.10.0'
  WORKING_DIR: './terraform'

jobs:
  code-quality:
    name: 'OpenTofu Format Check'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}

      - name: OpenTofu Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: tofu fmt -check -recursive

  security-scan:
    name: 'Security Scanning'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true  # Report issues but don't block deployment
          output_format: cli
          quiet: false

      - name: tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true  # Report issues but don't block deployment

  terraform-plan:
    name: 'Plan OpenTofu'
    runs-on: ubuntu-latest
    needs: [code-quality]
    environment: terraform-plan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Target Environment
        id: target_env
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "workspace=production" >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/production.tfvars" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "workspace=staging" >> $GITHUB_OUTPUT
            echo "tfvars_file=environments/staging.tfvars" >> $GITHUB_OUTPUT
          fi

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: OpenTofu Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu init \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/state/${{ steps.target_env.outputs.environment }}"

      - name: Select Workspace
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu workspace select ${{ steps.target_env.outputs.workspace }} || \
          tofu workspace new ${{ steps.target_env.outputs.workspace }}

      - name: OpenTofu Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: tofu validate -no-color

      - name: OpenTofu Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_gcp_project: gen-lang-client-0805519538
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_github_tokens: '{"maestro":"${{ secrets.GH_TOKEN_MAESTRO }}","beyond":"${{ secrets.GH_TOKEN_BEYOND }}"}'
          TF_VAR_google_drive_folder_id: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '' }}
          TF_VAR_obsidian_drive_folder_id: ${{ vars.OBSIDIAN_DRIVE_FOLDER_ID || '' }}
          TF_VAR_kanban_folder_id: ${{ vars.KANBAN_FOLDER_ID || '' }}
          TF_VAR_drive_poll_interval: ${{ vars.DRIVE_POLL_INTERVAL || '300' }}
          TF_VAR_function_url: ${{ vars.FUNCTION_URL || '' }}
          TF_VAR_repos_config_file: 'repos.json'
        run: |
          set +e
          tofu plan \
            -var-file="${{ steps.target_env.outputs.tfvars_file }}" \
            -no-color \
            -input=false \
            -out=tfplan \
            -detailed-exitcode 2>&1 | tee plan_output.txt

          EXIT_CODE=${PIPESTATUS[0]}
          echo "exitcode=${EXIT_CODE}" >> $GITHUB_OUTPUT

          # Exit code 0 or 2 are success (0=no changes, 2=changes detected)
          if [[ "${EXIT_CODE}" == "0" ]] || [[ "${EXIT_CODE}" == "2" ]]; then
            exit 0
          else
            exit 1
          fi
        continue-on-error: true

      - name: Upload Plan Artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.target_env.outputs.environment }}-pr-${{ github.event.pull_request.number }}
          path: terraform/tfplan
          retention-days: 30

      - name: Generate Plan Summary
        id: summary
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [[ "${{ steps.plan.outputs.exitcode }}" == "0" ]]; then
            echo "status=✅ No changes detected" >> $GITHUB_OUTPUT
            echo "details=Infrastructure matches configuration" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.plan.outputs.exitcode }}" == "2" ]]; then
            echo "status=📝 Changes detected" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            tofu show -no-color tfplan >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Plan failed" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            if [[ -f plan_output.txt ]]; then
              cat plan_output.txt >> $GITHUB_OUTPUT
            else
              echo "No plan output available. Check workflow logs for errors." >> $GITHUB_OUTPUT
            fi
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Plan
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_DETAILS: ${{ steps.summary.outputs.details }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const env = '${{ steps.target_env.outputs.environment }}';
            const status = '${{ steps.summary.outputs.status }}';
            const tfVersion = '${{ env.OPENTOFU_VERSION }}';
            const workspace = '${{ steps.target_env.outputs.workspace }}';
            const configFile = '${{ steps.target_env.outputs.tfvars_file }}';
            const details = process.env.PLAN_DETAILS;
            const baseRef = '${{ github.base_ref }}';
            const actor = '${{ github.actor }}';
            const runNumber = '${{ github.run_number }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            const output = `#### OpenTofu Plan for \`${env}\` Environment

            **Status:** ${status}

            **OpenTofu Version:** \`${tfVersion}\`
            **Workspace:** \`${workspace}\`
            **Config File:** \`${configFile}\`

            <details><summary>📋 Show Plan Details</summary>

            \`\`\`hcl
            ${details}
            \`\`\`

            </details>

            ---

            **Next Steps:**
            1. ✅ Review the plan carefully
            2. ✅ Ensure security scans passed
            3. ✅ Approve PR to merge to \`${baseRef}\`

            *Pusher: @${actor} | Run: [#${runNumber}](${runUrl})*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan Status Check
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "❌ OpenTofu plan failed"
          exit 1
