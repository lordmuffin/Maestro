name: 'OpenTofu Apply - Staging'

on:
  push:
    branches: [develop]
    paths:
      - 'opentofu/**'
      - 'V2V2B/**'
      - '.github/workflows/opentofu-apply-staging.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  OPENTOFU_VERSION: '1.10.0'
  WORKING_DIR: './opentofu'
  ENVIRONMENT: 'staging'
  # Azure Environment Variables
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  apply-staging:
    name: 'Apply to Staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: OpenTofu Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ env.ENVIRONMENT }}.terraform.tfstate"

      - name: Select Staging Workspace
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          tofu workspace select ${{ env.ENVIRONMENT }} || \
          tofu workspace new ${{ env.ENVIRONMENT }}

      - name: OpenTofu Plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_github_tokens: '{"maestro":"${{ secrets.GH_TOKEN_MAESTRO }}","beyond":"${{ secrets.GH_TOKEN_BEYOND }}"}'
          TF_VAR_google_drive_folder_id: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '' }}
          TF_VAR_obsidian_drive_folder_id: ${{ vars.OBSIDIAN_DRIVE_FOLDER_ID || '' }}
          TF_VAR_kanban_folder_id: ${{ vars.KANBAN_FOLDER_ID || '' }}
          TF_VAR_drive_poll_interval: ${{ vars.DRIVE_POLL_INTERVAL || '300' }}
          TF_VAR_repos_config_file: 'repos.json'
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
        run: |
          tofu plan \
            -var-file="environments/${{ env.ENVIRONMENT }}.tfvars" \
            -no-color \
            -out=tfplan

      - name: OpenTofu Apply
        id: apply
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_github_tokens: '{"maestro":"${{ secrets.GH_TOKEN_MAESTRO }}","beyond":"${{ secrets.GH_TOKEN_BEYOND }}"}'
          TF_VAR_google_drive_folder_id: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID || '' }}
          TF_VAR_obsidian_drive_folder_id: ${{ vars.OBSIDIAN_DRIVE_FOLDER_ID || '' }}
          TF_VAR_kanban_folder_id: ${{ vars.KANBAN_FOLDER_ID || '' }}
          TF_VAR_drive_poll_interval: ${{ vars.DRIVE_POLL_INTERVAL || '300' }}
          TF_VAR_repos_config_file: 'repos.json'
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
        run: tofu apply -auto-approve tfplan
        continue-on-error: false # Fail immediately if apply fails, no rollback logic for now as state is managed by Azure

      - name: Get OpenTofu Outputs
        if: steps.apply.outcome == 'success'
        id: outputs
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "function_url=$(tofu output -raw function_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "function_name=$(tofu output -raw function_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Create Deployment Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 Staging Deployment Summary
          
          **Environment:** \`${{ env.ENVIRONMENT }}\`
          **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Commit:** \`${{ github.sha }}\`
          **Author:** @${{ github.actor }}
          
          ### Status
          ${{ steps.apply.outcome == 'success' && '✅ **Deployment Successful**' || '❌ **Deployment Failed**' }}
          
          ${{ steps.apply.outcome == 'success' && format('**Function URL:** `{0}`', steps.outputs.outputs.function_url) || '**Error:** Check logs for details' }}
          EOF

      - name: Notify on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ vars.NOTIFICATION_EMAIL }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: '❌ Maestro Staging Deployment Failed (Azure)'
          to: ${{ vars.NOTIFICATION_EMAIL }}
          from: 'Maestro GitOps <${{ vars.NOTIFICATION_EMAIL }}>'
          body: |
            Staging deployment to Azure failed.
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
