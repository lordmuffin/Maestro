name: 'Terraform Deploy'

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TERRAFORM_VERSION: '1.6.0'
  WORKING_DIR: './terraform'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform:
    name: 'Terraform ${{ github.event_name == ''pull_request'' && ''Plan'' || github.event.inputs.action || ''Apply'' }}'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'terraform-plan' || 'project-maestro-gcp' }}
      url: ${{ steps.outputs.outputs.function_url }}

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Using Workload Identity Federation (Recommended for production)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }} #'projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID'
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }} #'your-service-account@your-project.iam.gserviceaccount.com'

      # Alternative: Using Service Account Key (less secure, commented out)
      # Uncomment this section and comment out the Workload Identity section above if needed
      # - name: Authenticate to Google Cloud (Service Account Key)
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Service Account Permissions
        run: |
          echo "Current authenticated account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          
          echo "Checking service account permissions..."
          SA_EMAIL=$(gcloud auth list --filter=status:ACTIVE --format="value(account)")
          
          echo "Service account: $SA_EMAIL"
          echo "Project: ${{ vars.GCP_PROJECT_ID }}"
          
          # Check if the service account has the necessary roles
          echo "Checking IAM policy for service account..."
          gcloud projects get-iam-policy ${{ vars.GCP_PROJECT_ID }} \
            --flatten="bindings[].members" \
            --format="table(bindings.role)" \
            --filter="bindings.members:$SA_EMAIL" || echo "Could not retrieve IAM policy"

      - name: Enable prerequisite GCP APIs
        run: |
          echo "Attempting to enable prerequisite APIs..."
          
          # Check current project
          CURRENT_PROJECT=$(gcloud config get-value project)
          echo "Current gcloud project: $CURRENT_PROJECT"
          echo "Target project: ${{ vars.GCP_PROJECT_ID }}"
          
          # Try to enable APIs with more detailed error handling
          echo "Enabling Service Usage API..."
          if ! gcloud services enable serviceusage.googleapis.com --project=${{ vars.GCP_PROJECT_ID }}; then
            echo ""
            echo "❌ Failed to enable Service Usage API"
            echo ""
            echo "Possible causes:"
            echo "1. Service account lacks 'Service Usage Admin' role (roles/serviceusage.serviceUsageAdmin)"
            echo "2. Service account lacks 'Project Editor' role (roles/editor)"
            echo "3. API propagation delay (try again in a few minutes)"
            echo ""
            echo "Required permissions for the service account:"
            echo "- roles/serviceusage.serviceUsageAdmin (to manage APIs)"
            echo "- roles/editor OR roles/owner (project-level access)"
            echo ""
            echo "Manual fix options:"
            echo "Option 1 - GCP Console: https://console.developers.google.com/apis/api/serviceusage.googleapis.com/overview?project=${{ vars.GCP_PROJECT_ID }}"
            echo "Option 2 - Add IAM role: gcloud projects add-iam-policy-binding ${{ vars.GCP_PROJECT_ID }} --member='serviceAccount:SA_EMAIL' --role='roles/serviceusage.serviceUsageAdmin'"
            exit 1
          fi
          
          echo "Enabling IAM API..."
          if ! gcloud services enable iam.googleapis.com --project=${{ vars.GCP_PROJECT_ID }}; then
            echo "Warning: Could not enable IAM API, but continuing..."
          fi
          
          echo "✓ Prerequisite APIs enabled successfully"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Validate Required Secrets
        run: |
          # Check for GCP_PROJECT_ID
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ] && [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::GCP_PROJECT_ID variable is not accessible. Please check environment configuration"
            exit 1
          fi
          
          # Check for GH_TOKEN
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "::error::GH_TOKEN secret is not set. Please configure it in environment settings"
            exit 1
          fi
          
          # Check for REPO_NAME
          if [ -z "${{ vars.REPO_NAME }}" ] && [ -z "$REPO_NAME" ]; then
            echo "::error::REPO_NAME variable is not accessible. Please check environment configuration"
            exit 1
          fi
          
          echo "All required variables and secrets are accessible"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan \
            -var="gcp_project=${{ vars.GCP_PROJECT_ID }}" \
            -var="github_token=${{ secrets.GH_TOKEN }}" \
            -var="repo_name=${{ vars.REPO_NAME }}"
        continue-on-error: true
        env:
          TF_VAR_gcp_project: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
          TF_VAR_repo_name: ${{ vars.REPO_NAME }}

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.WORKING_DIR }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: |
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="gcp_project=${{ vars.GCP_PROJECT_ID }}" \
            -var="github_token=${{ secrets.GH_TOKEN }}" \
            -var="repo_name=${{ vars.REPO_NAME }}"
        env:
          TF_VAR_gcp_project: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
          TF_VAR_repo_name: ${{ vars.REPO_NAME }}

      - name: Get Terraform Outputs
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        id: outputs
        run: |
          echo "function_url=$(terraform output -raw function_url 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "function_name=$(terraform output -raw function_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Display Deployment Summary
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          echo "================================================================"
          echo "Deployment Summary"
          echo "================================================================"
          echo "Function Name: ${{ steps.outputs.outputs.function_name }}"
          echo "Function URL: ${{ steps.outputs.outputs.function_url }}"
          echo "================================================================"

      - name: Upload Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

  security:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          output_format: cli
