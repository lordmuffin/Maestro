name: 'Terraform Deploy'

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TERRAFORM_VERSION: '1.6.0'
  WORKING_DIR: './terraform'
  TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform:
    name: 'Terraform ${{ github.event_name == ''pull_request'' && ''Plan'' || github.event.inputs.action || ''Apply'' }}'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'terraform-plan' || 'project-maestro-gcp' }}
      url: ${{ steps.outputs.outputs.function_url }}

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Using Workload Identity Federation (Recommended for production)
      # Temporarily disabled for testing
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }} #'projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID'
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }} #'your-service-account@your-project.iam.gserviceaccount.com'

      # Alternative: Using Service Account Key (less secure, commented out)
      # Uncomment this section and comment out the Workload Identity section above if needed
      # - name: Authenticate to Google Cloud (Service Account Key)
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # - name: Setup gcloud CLI
      #   uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=${{ env.TERRAFORM_STATE_BUCKET }}"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Import Existing Resources (if needed)
        id: import
        continue-on-error: true
        run: |
          # Import existing resources if they exist
          # This allows Terraform to manage resources that were created outside of Terraform

          PROJECT_ID="${{ secrets.GCP_PROJECT_ID || 'gen-lang-client-0805519538' }}"
          FUNCTION_NAME="v2v2b-interrogator"

          # Import Firestore database
          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_firestore_database.database "projects/$PROJECT_ID/databases/(default)" 2>/dev/null || true

          # Import Storage bucket
          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_storage_bucket.function_bucket "$PROJECT_ID-v2v2b-function-source" 2>/dev/null || true

          # Import Service account
          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_service_account.function_sa "projects/$PROJECT_ID/serviceAccounts/$FUNCTION_NAME-sa@$PROJECT_ID.iam.gserviceaccount.com" 2>/dev/null || true

          # Import API services
          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_project_service.cloud_functions "$PROJECT_ID/cloudfunctions.googleapis.com" 2>/dev/null || true

          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_project_service.cloud_build "$PROJECT_ID/cloudbuild.googleapis.com" 2>/dev/null || true

          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_project_service.firestore "$PROJECT_ID/firestore.googleapis.com" 2>/dev/null || true

          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_project_service.aiplatform "$PROJECT_ID/aiplatform.googleapis.com" 2>/dev/null || true

          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_project_service.chat "$PROJECT_ID/chat.googleapis.com" 2>/dev/null || true

          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            google_project_service.cloud_run "$PROJECT_ID/run.googleapis.com" 2>/dev/null || true

          # Import Firestore rules release (if it exists)
          terraform import -var="gcp_project=$PROJECT_ID" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}" \
            'google_firebaserules_release.firestore[0]' "projects/$PROJECT_ID/releases/cloud.firestore" 2>/dev/null || true

          echo "Import step completed (errors are expected if resources don't exist or are already imported)"

      # Temporarily disabled for testing
      # - name: Validate Required Secrets
      #   run: |
      #     if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
      #       echo "::error::GCP_PROJECT_ID secret is not set. Please configure it in Settings -> Environments -> project-maestro-gcp"
      #       exit 1
      #     fi
      #     if [ -z "${{ secrets.GH_TOKEN }}" ]; then
      #       echo "::error::GH_TOKEN secret is not set. Please configure it in Settings -> Environments -> project-maestro-gcp"
      #       exit 1
      #     fi
      #     if [ -z "${{ secrets.REPO_NAME }}" ]; then
      #       echo "::error::REPO_NAME secret is not set. Please configure it in Settings -> Environments -> project-maestro-gcp"
      #       exit 1
      #     fi
      #     echo "All required secrets are configured"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan \
            -var="gcp_project=${{ secrets.GCP_PROJECT_ID || 'gen-lang-client-0805519538' }}" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}"
        continue-on-error: true
        env:
          TF_VAR_gcp_project: ${{ secrets.GCP_PROJECT_ID || 'gen-lang-client-0805519538' }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}
          TF_VAR_repo_name: ${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.WORKING_DIR }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: |
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="gcp_project=${{ secrets.GCP_PROJECT_ID || 'gen-lang-client-0805519538' }}" \
            -var="github_token=${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}" \
            -var="repo_name=${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}"
        env:
          TF_VAR_gcp_project: ${{ secrets.GCP_PROJECT_ID || 'gen-lang-client-0805519538' }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN || 'dummy-token-for-testing' }}
          TF_VAR_repo_name: ${{ secrets.REPO_NAME || 'lordmuffin/Maestro' }}

      - name: Get Terraform Outputs
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        id: outputs
        run: |
          echo "function_url=$(terraform output -raw function_url 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "function_name=$(terraform output -raw function_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Display Deployment Summary
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          echo "================================================================"
          echo "Deployment Summary"
          echo "================================================================"
          echo "Function Name: ${{ steps.outputs.outputs.function_name }}"
          echo "Function URL: ${{ steps.outputs.outputs.function_url }}"
          echo "================================================================"

      - name: Upload Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

  security:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          output_format: cli
