---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpo
  namespace: maestro
  labels:
    app: mcpo
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpo
  template:
    metadata:
      labels:
        app: mcpo
        component: mcp-server
    spec:
      containers:
      - name: mcpo
        image: ghcr.io/open-webui/mcpo:main
        ports:
        - containerPort: 8002
          name: http
        command:
        - mcpo
        - --host
        - "0.0.0.0"
        - --port
        - "8002"
        - --api-key
        - "$(MCPO_API_KEY)"
        - --config
        - /config/multi-server.json
        env:
        - name: MCPO_API_KEY
          valueFrom:
            secretKeyRef:
              name: maestro-secrets
              key: MCPO_API_KEY
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: maestro-config
              key: NODE_ENV
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: sandbox
          mountPath: /app/sandbox
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8002
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /docs
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: mcpo-config
      - name: sandbox
        persistentVolumeClaim:
          claimName: mcpo-sandbox
